<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>World Time — Dhaka Reference</title>
<style>
  :root{
    --bg:#070910;
    --card:rgba(18,22,34,.78);
    --border:rgba(255,255,255,.10);
    --text:#f4f7ff;
    --muted:#8e98ad;
    --accent:#7c8cff;
    --green:#35f58b;
    --red:#ff4f67;
  --blue:#4da3ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 0%,rgba(91,108,255,.16),transparent 30%),
      radial-gradient(circle at 90% 15%,rgba(0,220,255,.08),transparent 25%),
      var(--bg);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  header{
    padding:42px 22px 28px;
    text-align:center;
  }
  .eyebrow{
    color:var(--accent);
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
  }
  h1{margin:9px 0 7px;font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.045em}
  .subtitle{margin:0;color:var(--muted);font-size:.95rem}
  .toolbar{
    width:min(1120px,calc(100% - 28px));
    margin:0 auto 24px;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  button{
    border:1px solid var(--border);
    background:rgba(255,255,255,.055);
    color:var(--text);
    border-radius:12px;
    padding:10px 15px;
    cursor:pointer;
    font:inherit;
  }
  button:hover{background:rgba(255,255,255,.09)}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .green{background:var(--green);box-shadow:0 0 12px var(--green)}
  .red{background:var(--red);box-shadow:0 0 12px var(--red)}
  main{
    width:min(1120px,calc(100% - 28px));
    margin:auto;
    padding-bottom:45px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
    gap:14px;
  }
  .clock{
    position:relative;
    overflow:hidden;
    padding:19px;
    min-height:175px;
    border:1px solid var(--border);
    border-radius:20px;
    background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025)),var(--card);
    backdrop-filter:blur(15px);
    transition:.3s ease;
  }
  .clock.reference{border-color:rgba(124,140,255,.48)}
  .clock.red-glow{
    border-color:rgba(255,79,103,.9);
    box-shadow:0 0 16px rgba(255,79,103,.42),inset 0 0 18px rgba(255,79,103,.07);
  }
  .clock.blue-glow{
    border-color:rgba(77,163,255,.9);
    box-shadow:0 0 16px rgba(77,163,255,.42),inset 0 0 18px rgba(77,163,255,.07);
  }
  .clock.green-glow{
    border-color:rgba(53,245,139,.9);
    box-shadow:0 0 16px rgba(53,245,139,.42),inset 0 0 18px rgba(53,245,139,.07);
  }
  .clock{padding-right:132px}
  .sprite{position:absolute;right:8px;bottom:8px;width:116px;height:145px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 7px rgba(0,0,0,.38));user-select:none;transition:transform .35s ease,filter .35s ease;cursor:pointer}
  .clock:hover .sprite{transform:translateY(-5px) scale(1.03);filter:drop-shadow(0 12px 10px rgba(0,0,0,.48))}
  .sprite-fallback{position:absolute;right:16px;bottom:20px;width:94px;text-align:center;color:var(--muted);font-size:.62rem;line-height:1.25;opacity:.55}

  .coord-overlay{
    position:fixed;inset:0;
    background:rgba(5,7,14,.62);
    backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;
    z-index:999;padding:20px;
  }
  .coord-overlay.show{display:flex}
  .coord-banner{
    position:relative;
    padding:26px 30px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--blue) 45%,var(--green));
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    min-width:260px;max-width:90vw;
    animation:popIn .25s ease;
  }
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .coord-close{
    position:absolute;top:8px;right:10px;
    background:none;border:none;color:#fff;
    font-size:1rem;cursor:pointer;padding:6px;line-height:1;
  }
  .coord-city{font-weight:800;font-size:1.08rem;color:#fff;margin-bottom:12px;letter-spacing:.02em}
  .coord-row{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;
    margin-bottom:8px;
  }
  .coord-row:last-child{margin-bottom:0}
  .coord-label{color:rgba(255,255,255,.75);font-size:.72rem;font-weight:700;white-space:nowrap}
  .coord-value{color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;flex:1;word-break:break-all}
  .coord-copy{
    border:none;border-radius:8px;background:rgba(255,255,255,.92);
    color:#12162a;font-weight:800;padding:7px 12px;cursor:pointer;
    font-size:.76rem;white-space:nowrap;transition:background .2s;
  }
  .coord-copy:hover{background:#fff}
  .coord-copy.copied{background:var(--green)}
  .top{display:flex;align-items:center;gap:10px}
  .flag{font-size:1.45rem}
  .city{font-weight:750;font-size:1rem}
  .zone{margin-top:2px;color:var(--muted);font-size:.72rem}
  .reference-tag{
    margin-left:auto;
    padding:4px 7px;border-radius:7px;
    background:rgba(124,140,255,.13);
    color:#aeb7ff;font-size:.62rem;font-weight:800;
  }
  .time{
    margin-top:18px;
    font-size:2rem;
    line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.035em;
    font-weight:800;
  }
  .date{margin-top:9px;color:#c1c8d8;font-size:.86rem}
  .offset{margin-top:5px;color:var(--muted);font-size:.7rem}
  footer{text-align:center;color:#596277;font-size:.72rem;padding:0 20px 25px}
  @media(max-width:560px){
    header{padding-top:30px}
    main{grid-template-columns:1fr}
    .clock{min-height:170px;padding-right:112px}
    .sprite{width:98px;height:125px;right:3px}
  }
</style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d1b3a">
</head>
<body>
<header>
  <div class="eyebrow">World Time</div>
  <h1>Time Around the World</h1>
  <p class="subtitle">Every clock follows its own local date and timezone.</p>
</header>

<div class="toolbar">
  <button id="formatBtn">24-hour</button>
  <div class="legend">
    <span><i class="dot red"></i>Community Day</span>
    <span><i class="dot green"></i>Spotlight & Raid Hour</span>
    <span><i class="dot" style="background:var(--blue);box-shadow:0 0 12px var(--blue)"></i>Showcase Hour</span>
  </div>
</div>

<main id="clocks"></main>
<footer>25 locations · Reference timezone: Asia/Dhaka · Times update every second</footer>

<div id="coordOverlay" class="coord-overlay" onclick="if(event.target===this) closeCoordBanner()">
  <div class="coord-banner">
    <button class="coord-close" onclick="closeCoordBanner()">✕</button>
    <div class="coord-city" id="coordCity"></div>
    <div id="coordRows"></div>
  </div>
</div>

<script>
const spriteNames = {
  "Dhaka":"Incineroar","Sydney":"Corsola","Auckland":"Relicanth","Tokyo":"Ogerpon","Osaka":"Fezandipiti","Seoul":"Mega Lopunny",
  "Taipei":"Chien-Pao","Singapore":"Hisuian Arcanine","Kuala Lumpur":"Arcanine","Mumbai":"Alolan Muk",
  "Dubai":"Gigantamax Duraludon","Tehran":"Entei","Riyadh":"Sandaconda","Cairo":"Lucario",
  "Istanbul":"Midnight Lycanroc","Zaragoza":"Paldean Tauros — Aqua Breed","Madrid":"Paldean Tauros — Combat Breed",
  "Seville":"Paldean Tauros — Blaze Breed","Paris":"Eternal Floette","London":"Galarian Obstagoon",
  "São Paulo":"Skeledirge","Rio de Janeiro":"Mega Barbaracle","Mexico City":"Mega Hawlucha",
  "New York City":"Black Kyurem","Chicago":"Swampert","San Francisco":"White Kyurem"
};
const GITHUB_USER = "Nufichan";
const GITHUB_REPO = "PoGo-Time-Zone";
const GITHUB_BRANCH = "main";

function spriteUrl(city){
  return `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${GITHUB_BRANCH}/Photos/${encodeURIComponent(city)}.gif`;
}

const spriteMap = {};
Object.keys(spriteNames).forEach(city=>{ spriteMap[city] = spriteUrl(city); });

const coordinates = {
  "Dhaka": [
    {label:"Dhanmondi", value:"23.748190,90.377977"},
    {label:"Ramna", value:"23.735030,90.402503"}
  ],
  "Tokyo":"35.669590,139.699690",
  "Osaka":"34.650110,135.510500",
  "Sydney":"-33.862400,151.210700",
  "Auckland":"-36.852095,174.763180",
  "Seoul":"37.566011,126.978114",
  "Taipei":"25.047386,121.517158",
  "Singapore":"1.287481,103.851829",
  "Kuala Lumpur":"3.156457,101.713357",
  "Mumbai":"19.025993,72.839677",
  "Dubai":"25.075201,55.131068",
  "Tehran":"35.777801,51.410630",
  "Riyadh":"24.756886,46.629453",
  "Cairo":"30.011510,31.208532",
  "Istanbul":[
    {label:"Ankara", value:"38.463400,27.216300"},
    {label:"Istanbul", value:"41.012693,28.980088"}
  ],
  "Zaragoza":"41.657700,-0.896813",
  "Madrid":[
    {label:"Park", value:"40.458393,-3.606734"},
    {label:"City", value:"40.416705,-3.703583"}
  ],
  "Seville":"37.384992,-6.004329",
  "Paris":"48.891330,2.237520",
  "London":"51.501637,-0.139840",
  "São Paulo":"-23.546206,-46.658549",
  "Rio de Janeiro":"-22.911391,-43.214475",
  "Mexico City":"19.435700,-99.143900",
  "New York City":"40.755200,-73.983000",
  "Chicago":"41.883317,-87.623445",
  "San Francisco":"37.808600,-122.409800"
};

function openCoordBanner(city){
  document.getElementById("coordCity").textContent = city;
  const data = coordinates[city];
  const rows = Array.isArray(data)
    ? data
    : [{label:null, value: data || "Coordinates unavailable"}];

  document.getElementById("coordRows").innerHTML = rows.map((r,i)=>`
    <div class="coord-row">
      ${r.label ? `<span class="coord-label">${r.label}</span>` : ""}
      <span class="coord-value" id="coordValue-${i}">${r.value}</span>
      <button class="coord-copy" onclick="copyCoord(${i})">Copy</button>
    </div>
  `).join("");

  document.getElementById("coordOverlay").classList.add("show");
}
function closeCoordBanner(){
  document.getElementById("coordOverlay").classList.remove("show");
}
function copyCoord(i){
  const el = document.getElementById(`coordValue-${i}`);
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = el.nextElementSibling;
    const original = btn.textContent;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove("copied"); },1500);
  });
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeCoordBanner();
});

const places = [
  ["🇧🇩","Dhaka","Bangladesh","Asia/Dhaka",true],
  ["🇯🇵","Tokyo","Japan","Asia/Tokyo"],
  ["🇯🇵","Osaka","Japan","Asia/Tokyo"],
  ["🇰🇷","Seoul","South Korea","Asia/Seoul"],
  ["🇦🇺","Sydney","Australia","Australia/Sydney"],
  ["🇳🇿","Auckland","New Zealand","Pacific/Auckland"],
  ["🇹🇼","Taipei","Taiwan","Asia/Taipei"],
  ["🇸🇬","Singapore","Singapore","Asia/Singapore"],
  ["🇲🇾","Kuala Lumpur","Malaysia","Asia/Kuala_Lumpur"],
  ["🇮🇳","Mumbai","India","Asia/Kolkata"],
  ["🇦🇪","Dubai","UAE","Asia/Dubai"],
  ["🇮🇷","Tehran","Iran","Asia/Tehran"],
  ["🇸🇦","Riyadh","Saudi Arabia","Asia/Riyadh"],
  ["🇪🇬","Cairo","Egypt","Africa/Cairo"],
  ["🇹🇷","Istanbul","Türkiye","Europe/Istanbul"],
  ["🇪🇸","Zaragoza","Spain","Europe/Madrid"],
  ["🇪🇸","Madrid","Spain","Europe/Madrid"],
  ["🇪🇸","Seville","Spain","Europe/Madrid"],
  ["🇫🇷","Paris","France","Europe/Paris"],
  ["🇬🇧","London","United Kingdom","Europe/London"],
  ["🇧🇷","São Paulo","Brazil","America/Sao_Paulo"],
  ["🇧🇷","Rio de Janeiro","Brazil","America/Sao_Paulo"],
  ["🇲🇽","Mexico City","Mexico","America/Mexico_City"],
  ["🇺🇸","New York City","USA","America/New_York"],
  ["🇺🇸","Chicago","USA","America/Chicago"],
  ["🇺🇸","San Francisco","USA","America/Los_Angeles"]
];

let hour12 = false;
const container = document.getElementById("clocks");

places.forEach((p,i)=>{
  const card=document.createElement("article");
  card.className="clock"+(p[4]?" reference":"");
  card.innerHTML=`
    <div class="top">
      <span class="flag">${p[0]}</span>
      <div>
        <div class="city">${p[1]}</div>
        <div class="zone">${p[2]}</div>
      </div>
      ${p[4]?'<span class="reference-tag">REFERENCE</span>':''}
    </div>
    <img class="sprite" data-city="${p[1]}" src="${spriteMap[p[1]]}" alt="${spriteNames[p[1]]} sprite"
         onclick="openCoordBanner('${p[1]}')"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="sprite-fallback" style="display:none">${spriteNames[p[1]]}<br>sprite missing</div>
    <div class="time" id="time-${i}">--:--:--</div>
    <div class="date" id="date-${i}">Loading…</div>
    <div class="offset" id="offset-${i}">${p[3]}</div>
  `;
  container.appendChild(card);
  p.card=card;
});

function parts(date,tz,options){
  return new Intl.DateTimeFormat("en-US",{timeZone:tz,...options}).format(date);
}
function update(){
  const now=new Date();
  places.forEach((p,i)=>{
    const timeEl=document.getElementById(`time-${i}`);
    const dateEl=document.getElementById(`date-${i}`);
    const offsetEl=document.getElementById(`offset-${i}`);

    timeEl.textContent=new Intl.DateTimeFormat("en-US",{
      timeZone:p[3],hour:"2-digit",minute:"2-digit",second:"2-digit",
      hour12
    }).format(now);

    dateEl.textContent=new Intl.DateTimeFormat("en-US",{
      timeZone:p[3],weekday:"long",month:"long",day:"numeric",year:"numeric"
    }).format(now);

    const hour=Number(new Intl.DateTimeFormat("en-US",{
      timeZone:p[3],hour:"numeric",hour12:false
    }).format(now));

    p.card.classList.remove("red-glow","green-glow","blue-glow");
    if(hour>=14 && hour<17) p.card.classList.add("red-glow");
    else if(hour>=18 && hour<19) p.card.classList.add("green-glow");
    else if(hour>=19 && hour<20) p.card.classList.add("blue-glow");

    const tzParts=new Intl.DateTimeFormat("en-US",{
      timeZone:p[3],timeZoneName:"longOffset"
    }).formatToParts(now);
    const zone=tzParts.find(x=>x.type==="timeZoneName");
    offsetEl.textContent=zone ? `${p[3]} · ${zone.value.replace("GMT","UTC")}` : p[3];
  });
}
document.getElementById("formatBtn").onclick=()=>{
  hour12=!hour12;
  document.getElementById("formatBtn").textContent=hour12?"12-hour":"24-hour";
  update();
};
update();
setInterval(update,1000);
</script>
  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
  </script>
</body>
</html>
